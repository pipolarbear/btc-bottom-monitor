name: Publish

on:
  schedule:
    # 20:00 UTC = ~07:00 in Canberra (AEDT), matching the upstream daily task.
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: main

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh snapshots
        if: github.event_name != 'push'
        run: node main/scripts/refresh.mjs --data-dir data-branch

      - name: Commit snapshots
        if: github.event_name != 'push'
        run: |
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily.ndjson lib.ndjson
          if git diff --cached --quiet; then
            echo "No new snapshot."
            exit 0
          fi
          git commit -m "snapshot $(date -u +%F)"
          git push

      - name: Build site
        run: node main/scripts/build.mjs --data-dir data-branch --out main/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
